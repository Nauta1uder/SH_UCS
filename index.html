<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蔚来上海车美服务方案</title>
  <style>
    :root{--bg:#f6f7fa;--surface:#fff;--surface-alt:#f6f7fa;--navy:#00263c;--text:#040b29;--muted:#595e72;--tertiary:#868a9a;--teal:#00b3be;--teal-dark:#008296;--teal-soft:#e6fafb;--gold:#ffbe45;--line:#e6e7ec;--line-strong:#ced0d8;--shadow-base:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);--shadow-raised:0 4px 8px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.57;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    .shell{max-width:1200px;margin:auto;padding:0 24px 48px}
    .nav{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:14px;color:var(--navy);font-weight:600;letter-spacing:.04em}.logo{font-size:24px;letter-spacing:.02em}.divider{height:20px;width:1px;background:var(--line-strong)}.branch{font-size:14px}.navtag{font-size:12px;color:var(--muted);letter-spacing:.12em}
    .hero{min-height:304px;display:flex;align-items:center;padding:48px 40px;position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:4px;margin-top:24px}
    .hero-media{position:absolute;inset:0 0 0 auto;width:52%;height:100%;object-fit:cover;object-position:43% center;opacity:1;filter:none}
    .hero-copy{position:relative;z-index:2;max-width:560px}.eyebrow{color:#76e2df;font-size:12px;font-weight:500;letter-spacing:.18em;margin-bottom:16px}.hero h1{font-weight:600;font-size:32px;line-height:1.25;letter-spacing:.04em;margin:0 0 12px}.subtitle{font-size:18px;line-height:1.5;letter-spacing:.08em;color:rgba(255,255,255,.9)}.hero-line{margin-top:24px;color:rgba(255,255,255,.68);letter-spacing:.1em;font-size:13px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-base)}
    .model-panel{padding:24px;margin-top:24px}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}.section-title h2{font-size:20px;line-height:1.4;margin:0;font-weight:600;letter-spacing:0}.section-title span{font-size:12px;color:var(--tertiary)}
    .model-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.model-card{min-height:72px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:14px 10px;color:var(--text);cursor:pointer;text-align:center;transition:background .15s,border-color .15s,box-shadow .15s}.model-card:hover{border-color:var(--teal);background:#fbffff;box-shadow:var(--shadow-raised)}.model-card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}.model-card.active{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}.model-main{display:block;font-weight:600;font-size:15px;line-height:1.5}.model-badge{display:block;color:var(--muted);font-size:11px;line-height:1.6;margin-top:2px}
    .catalog{padding:24px;margin-top:24px}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:8px}.tab{padding:0 2px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}.tab:hover{color:var(--text)}.tab.active{color:var(--teal-dark);border-color:var(--teal)}
    .product-summary{display:flex;justify-content:space-between;gap:20px;padding:16px 4px 14px;color:var(--muted);font-size:13px}.product-summary strong{color:var(--text);font-weight:600}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;min-width:720px}th{background:var(--surface-alt);color:var(--muted);font-size:12px;font-weight:600;text-align:left;padding:12px 14px}th:not(:first-child),td:not(:first-child){text-align:right}td{padding:14px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}tr.selectable{cursor:pointer;transition:background .15s}tr.selectable:hover{background:rgba(4,11,41,.04)}tr.selected{background:var(--teal-soft)}.product-name{font-weight:600;font-size:15px;color:var(--text);text-align:left}.desc{font-size:12px;color:var(--tertiary);margin-top:4px;text-align:left}.recommended{display:inline-block;margin-left:8px;border-radius:2px;background:var(--teal);color:#fff;padding:2px 6px;font-size:10px;font-weight:500}.money{white-space:nowrap;color:var(--muted)}.final{font-size:18px;font-weight:700;color:var(--text)}.save{color:var(--teal-dark);font-size:12px;margin-top:2px}
    .reason{margin-top:16px;padding:16px;border-left:3px solid var(--teal);background:#f0fbfb;border-radius:2px}.reason-title{color:var(--teal-dark);font-size:14px;font-weight:600;margin-bottom:8px}.reason p{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.67}.reason p:last-child{margin-bottom:0}.footer-mark{text-align:center;color:var(--tertiary);font-size:11px;letter-spacing:.12em;margin-top:24px}
    @media(max-width:980px){.hero{min-height:280px;padding:42px 28px}.hero-media{width:60%;object-position:45% center}.model-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:580px){.shell{padding:0 12px 32px}.nav{height:52px}.navtag{display:none}.hero{min-height:0;display:flex;flex-direction:column;align-items:stretch;padding:0 16px 28px;gap:24px;margin-top:16px}.hero-copy{order:2}.hero-media{position:relative;order:1;inset:auto;width:calc(100% + 32px);height:auto;aspect-ratio:2.2/1;margin:0 -16px;object-fit:cover;object-position:43% center;opacity:1}.eyebrow{font-size:11px;margin-bottom:12px}.hero h1{font-size:26px;letter-spacing:.02em;margin-bottom:8px}.subtitle{font-size:16px}.hero-line{margin-top:18px;font-size:11px;letter-spacing:.05em}.model-panel,.catalog{padding:16px;margin-top:16px}.model-grid{grid-template-columns:repeat(2,1fr);gap:8px}.model-card{min-height:68px;padding:12px 8px}.section-title{display:block;margin-bottom:12px}.section-title span{display:block;margin-top:4px}.catalog{padding:16px 12px}.tabs{gap:20px}.product-summary{display:block;line-height:1.8}.product-summary span{display:block}.reason{padding:14px}.table-wrap{margin:0 -1px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}table{min-width:720px;table-layout:auto}table th:first-child,table td:first-child{width:36%;text-align:left}table th:nth-child(2),table td:nth-child(2){width:16%}table th:nth-child(3),table td:nth-child(3){width:14%}table th:nth-child(4),table td:nth-child(4){width:16%}table th:nth-child(5),table td:nth-child(5){width:18%}td{padding:13px 8px;font-size:13px}.product-name{font-size:14px}.desc{font-size:11px}.final{font-size:16px}}
  </style>

  <script>
    const DATA=JSON.parse(document.getElementById('vehicle-data').textContent);
    let modelId='et5',tab='windows',selectedPlan='';
    const money=n=>'¥'+Number(n).toLocaleString('zh-CN');
    const modelGrid=document.getElementById('modelGrid'),body=document.getElementById('productBody');
    const brandOf=name=>name.replace('三膜套餐','');
    function updateReason(name){
      const brand=brandOf(name);
      <!-- document.getElementById('reasonBrand').textContent=brand; -->
      if(tab==='packages'&&DATA.packageNotes[modelId]){
        document.getElementById('reasonText').innerHTML=DATA.packageNotes[modelId].map(p=>'<p>'+p+'</p>').join('');
        return;
      }
      const base=(DATA.notes[brand]||'')+(tab==='packages'?' 套餐同时包含车衣与内饰膜，形成从玻璃、漆面到内饰的完整防护。':'');
      const extra=[
        '蔚来官方量子膜支持官方8年质保，日常出现起泡、褪色、脱胶、开裂等非人为质量问题，均可免费更换维保，全程官方兜底，用车终身安心',
        '所有施工均为门店标准化合规施工，录入蔚来官方系统，售后记录完整、正规可查。针对蔚来全系智能电车的雷达、摄像头、5G信号、车机网络深度适配',
        '采用高端磁控溅射非金属工艺，无金属涂层干扰，完全不遮挡导航、自动驾驶感知信号、蓝牙及车机信号，不会出现信号减弱、断连、感应失灵等问题，完美适配蔚来智能用车场景'
      ];
      document.getElementById('reasonText').innerHTML=[base].concat(extra).map(p=>'<p>'+p+'</p>').join('');
    }
    function renderModels(){
      modelGrid.innerHTML=DATA.models.map(m=>`<button class="model-card ${m.id===modelId?'active':''}" data-id="${m.id}"><span class="model-main">${m.short}</span>${m.badge?`<span class="model-badge">${m.badge}</span>`:''}</button>`).join('');
      modelGrid.querySelectorAll('.model-card').forEach(b=>b.onclick=()=>{modelId=b.dataset.id;selectedPlan='';sync()});
    }
    function renderTable(){
      const model=DATA.models.find(x=>x.id===modelId),rows=DATA[tab][modelId];
      document.getElementById('currentModel').textContent=model.label;document.getElementById('modelNote').textContent=model.note||'';
      body.innerHTML=rows.map(r=>{const [name,desc,orig,coupon,points,final,reco]=r;return `<tr class="selectable ${selectedPlan===name?'selected':''}" data-name="${name}"><td><div class="product-name">${name}${reco?'<span class="recommended">推荐</span>':''}</div><div class="desc">${desc}</div></td><td class="money">${money(orig)}</td><td class="money">${coupon?money(coupon):'—'}</td><td class="money">${money(points)}</td><td class="money"><div class="final">${money(final)}</div><div class="save">立省 ${money(orig-final)}</div></td></tr>`}).join('');
      body.querySelectorAll('tr.selectable').forEach(tr=>tr.onclick=()=>{selectedPlan=tr.dataset.name;renderTable()});
      const reco=rows.find(r=>r[6])||rows[0];
      updateReason(selectedPlan||reco[0]);
    }
    function sync(){renderModels();renderTable()}
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');tab=t.dataset.tab;selectedPlan='';renderTable()});
    sync();
  </script>
