<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蔚来长春车美服务方案</title>
  <style>
    :root{--bg:#071019;--panel:#0d1822;--panel2:#111f2b;--line:#263944;--text:#f4f7f8;--muted:#91a0aa;--accent:#39b9b5;--accent2:#77d3cf;--warm:#cba87b}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at 70% -10%,#20303c 0,#071019 42%,#050b11 100%);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    button{font:inherit}
    .shell{max-width:1320px;margin:auto;padding:0 26px 56px}
    .nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;align-items:center;gap:18px;font-weight:650;letter-spacing:.08em}.logo{font-size:29px;letter-spacing:.02em}.divider{height:23px;width:1px;background:#64727d}.branch{font-size:15px}.navtag{font-size:13px;color:#b9c3c9;letter-spacing:.16em}
    .hero{min-height:300px;display:flex;align-items:center;padding:66px 48px 52px;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06)}
    .hero:after{content:"";position:absolute;right:0;top:0;width:48%;height:100%;background:radial-gradient(circle at 65% 45%,rgba(57,185,181,.18),transparent 60%);pointer-events:none}
    .hero-copy{position:relative;z-index:1}.eyebrow{color:var(--accent2);font-size:13px;letter-spacing:.22em;margin-bottom:22px}h1{font-weight:350;font-size:50px;letter-spacing:.12em;margin:0 0 15px}.subtitle{font-size:22px;letter-spacing:.22em;color:#d8dee2}.hero-line{margin-top:34px;color:#aab5bb;letter-spacing:.25em;font-size:13px}
    .panel{background:linear-gradient(145deg,rgba(16,29,40,.96),rgba(10,20,29,.96));border:1px solid rgba(122,157,177,.16);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
    .model-panel{padding:22px;margin-top:-14px;position:relative;z-index:2}.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.section-title h2{font-size:21px;margin:0;font-weight:500;letter-spacing:.05em}.section-title span{font-size:12px;color:var(--muted)}
    .model-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.model-card{background:#101d27;border:1px solid #263845;border-radius:12px;padding:17px 10px;color:#dce4e8;cursor:pointer;text-align:center;transition:.2s}.model-card:hover{transform:translateY(-2px);border-color:#3e6e76}.model-card.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(57,185,181,.25);background:linear-gradient(145deg,#142a32,#0d1a24)}.model-main{font-weight:650;font-size:15px}.model-badge{display:block;color:#91a4ae;font-size:11px;margin-top:4px}
    .catalog{padding:22px;margin-top:16px}.tabs{display:flex;gap:28px;border-bottom:1px solid #24343f;margin-bottom:8px}.tab{padding:0 3px 14px;color:#9baab3;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#eaf4f4;border-color:var(--accent)}
    .product-summary{display:flex;justify-content:space-between;gap:20px;padding:18px 4px 14px;color:#9fadb5;font-size:13px}.product-summary strong{color:#f0f5f6;font-weight:500}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #283a45;border-radius:12px;overflow:hidden;min-width:720px}th{background:#14212c;color:#aebac0;font-size:12px;text-align:left;padding:14px}td{padding:16px 14px;border-top:1px solid #263742;font-size:14px}tr.selectable{cursor:pointer;transition:.15s}tr.selectable:hover{background:#12242d}tr.selected{background:linear-gradient(90deg,rgba(57,185,181,.14),rgba(57,185,181,.03))}.product-name{font-weight:650;font-size:15px}.desc{font-size:12px;color:#8fa0aa;margin-top:5px}.recommended{display:inline-block;margin-left:8px;border-radius:4px;background:#297c62;color:#dff9ec;padding:2px 6px;font-size:10px}.money{white-space:nowrap}.final{font-size:18px;font-weight:700;color:#fff}.save{color:var(--accent2);font-size:12px;margin-top:3px}
    .reason{margin-top:16px;padding:18px;border-left:2px solid var(--warm);background:rgba(203,168,123,.08);border-radius:4px 12px 12px 4px}.reason-title{color:#d7b98f;font-size:13px;font-weight:650;margin-bottom:8px}.reason p{margin:0 0 10px;color:#b7c1c7;font-size:13px;line-height:1.75}.reason p:last-child{margin-bottom:0}.footer-mark{text-align:center;color:#586872;font-size:11px;letter-spacing:.12em;margin-top:22px}
    @media(max-width:980px){.hero{min-height:260px;padding:54px 24px 44px}.model-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:580px){.shell{padding:0 12px 35px}.nav{height:66px}.navtag{display:none}.hero{padding:46px 10px 40px}.eyebrow{font-size:11px}.hero h1{font-size:31px;letter-spacing:.08em}.subtitle{font-size:16px}.hero-line{font-size:11px;letter-spacing:.12em}.model-grid{grid-template-columns:repeat(2,1fr)}.section-title{display:block}.section-title span{display:block;margin-top:7px}.catalog{padding:16px 12px}.tabs{gap:20px}.product-summary{display:block;line-height:1.8}.product-summary span{display:block}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav">
      <div class="brand"><span class="logo">NIO</span><span class="divider"></span><span class="branch">长春区域</span></div>
      <div class="navtag">蔚来车美服务｜专业守护，始终如新</div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">NIO · CHANGCHUN</div>
        <h1>蔚来车美套餐方案</h1>
        <div class="subtitle">长春区域专属服务</div>
        <div class="hero-line">专业守护 · 品质体验 · 随心出行</div>
      </div>
    </section>

    <section class="panel model-panel">
      <div class="section-title"><h2>选择车型</h2><span>不同车型对应不同套餐价格</span></div>
      <div class="model-grid" id="modelGrid"></div>
    </section>

    <main class="panel catalog">
      <div class="tabs">
        <div class="tab active" data-tab="windows">窗膜产品</div>
        <div class="tab" data-tab="packages">三膜套餐</div>
      </div>
      <div class="product-summary"><span>当前车型：<strong id="currentModel"></strong></span><span id="modelNote"></span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>方案名称</th><th>原价</th><th>券减</th><th>积分抵扣</th><th>到手价</th></tr></thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
      <div class="reason"><div class="reason-title">推荐理由 · <span id="reasonBrand"></span></div><div id="reasonText"></div></div>
    </main>

    <div class="footer-mark">NIO · CHANGCHUN</div>
  </div>

  </script>
  <script>
    const DATA=JSON.parse(document.getElementById('vehicle-data').textContent);
    let modelId='et5',tab='windows',selectedPlan='';
    const money=n=>'¥'+Number(n).toLocaleString('zh-CN');
    const modelGrid=document.getElementById('modelGrid'),body=document.getElementById('productBody');
    const brandOf=name=>name.replace('三膜套餐','');
    function updateReason(name){
      const brand=brandOf(name);
      document.getElementById('reasonBrand').textContent=brand;
      const base=(DATA.notes[brand]||'')+(tab==='packages'?' 套餐同时包含车衣与内饰膜，形成从玻璃、漆面到内饰的完整防护。':'');
      const extra=[
        '蔚来官方量子膜支持官方8年质保，日常出现起泡、褪色、脱胶、开裂等非人为质量问题，均可免费更换维保，全程官方兜底，用车终身安心',
        '所有施工均为门店标准化合规施工，录入蔚来官方系统，售后记录完整、正规可查。针对蔚来全系智能电车的雷达、摄像头、5G信号、车机网络深度适配',
        '采用高端磁控溅射非金属工艺，无金属涂层干扰，完全不遮挡导航、自动驾驶感知信号、蓝牙及车机信号，不会出现信号减弱、断连、感应失灵等问题，完美适配蔚来智能用车场景'
      ];
      document.getElementById('reasonText').innerHTML=[base].concat(extra).map(p=>'<p>'+p+'</p>').join('');
    }
    function renderModels(){
      modelGrid.innerHTML=DATA.models.map(m=>`<button class="model-card ${m.id===modelId?'active':''}" data-id="${m.id}"><span class="model-main">${m.short}</span>${m.badge?`<span class="model-badge">${m.badge}</span>`:''}</button>`).join('');
      modelGrid.querySelectorAll('.model-card').forEach(b=>b.onclick=()=>{modelId=b.dataset.id;selectedPlan='';sync()});
    }
    function renderTable(){
      const model=DATA.models.find(x=>x.id===modelId),rows=DATA[tab][modelId];
      document.getElementById('currentModel').textContent=model.label;document.getElementById('modelNote').textContent=model.note||'';
      body.innerHTML=rows.map(r=>{const [name,desc,orig,coupon,points,final,reco]=r;return `<tr class="selectable ${selectedPlan===name?'selected':''}" data-name="${name}"><td><div class="product-name">${name}${reco?'<span class="recommended">推荐</span>':''}</div><div class="desc">${desc}</div></td><td class="money">${money(orig)}</td><td class="money">${coupon?money(coupon):'—'}</td><td class="money">${money(points)}</td><td class="money"><div class="final">${money(final)}</div><div class="save">立省 ${money(orig-final)}</div></td></tr>`}).join('');
      body.querySelectorAll('tr.selectable').forEach(tr=>tr.onclick=()=>{selectedPlan=tr.dataset.name;renderTable()});
      const reco=rows.find(r=>r[6])||rows[0];
      updateReason(selectedPlan||reco[0]);
    }
    function sync(){renderModels();renderTable()}
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');tab=t.dataset.tab;selectedPlan='';renderTable()});
    sync();
  </script>
</body>
</html>
